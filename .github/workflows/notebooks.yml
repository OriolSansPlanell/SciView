name: Notebooks

# The example notebooks render whole films, so they run when they or the library change, once a week, and on
# demand, rather than with every test run.
on:
  pull_request:
    paths:
      - "examples/notebooks/**"
      - "src/**"
      - "tools/run_notebooks.py"
      - ".github/workflows/notebooks.yml"
  push:
    branches: [main]
    paths:
      - "examples/notebooks/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Run the example notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" nbclient nbformat ipykernel
      - name: Check the notebook files
        run: python -c "import nbformat, pathlib; [nbformat.validate(nbformat.read(p, as_version=4)) for p in pathlib.Path('examples/notebooks').glob('*.ipynb')]"
      - name: Run every notebook
        run: python tools/run_notebooks.py
      - name: Keep the films
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-films
          path: examples/notebooks/films/**/*.mp4
          if-no-files-found: ignore
          retention-days: 7
